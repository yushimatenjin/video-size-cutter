<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Size Cutter - 動画サイズ圧縮</title>
  <meta name="description" content="DiscordやSNSに送る動画を、指定サイズ（10MB・20MBなど）に抑えてブラウザ内で圧縮。動画は外部に送信されません。" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2318181b'/%3E%3Cpath d='M20 22l12 12 12-12' stroke='white' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M20 34l12 12 12-12' stroke='white' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="26" height="26">
          <rect width="64" height="64" rx="14" fill="#18181b"/>
          <path d="M20 22l12 12 12-12" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20 34l12 12 12-12" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <div class="brand-text">
        <p class="brand-name">Video Size Cutter</p>
        <p class="brand-sub">ブラウザ内で完結する動画サイズ圧縮ツール</p>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- アップロード -->
    <section class="card" id="uploadCard">
      <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="動画ファイルを選択">
        <input type="file" id="fileInput" accept="video/*" hidden />
        <span class="dropzone-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V4"/>
            <path d="M7 9l5-5 5 5"/>
            <path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/>
          </svg>
        </span>
        <p class="dropzone-title">動画をドラッグ＆ドロップ</p>
        <p class="dropzone-sub">またはクリックしてファイルを選択</p>
        <p class="dropzone-hint">MP4 / WebM / MOV に対応（ブラウザで再生できる形式）</p>
      </div>
    </section>

    <!-- 設定 -->
    <section class="card" id="settingsCard" hidden>
      <h1 class="card-title">圧縮設定</h1>

      <div class="file-info" id="fileInfo"></div>

      <div class="field">
        <label for="targetSize">目標サイズ</label>
        <div class="size-presets" id="sizePresets">
          <button type="button" class="preset" data-mb="10">10 MB</button>
          <button type="button" class="preset" data-mb="20">20 MB</button>
          <button type="button" class="preset" data-mb="25">25 MB</button>
          <button type="button" class="preset" data-mb="50">50 MB</button>
        </div>
        <div class="size-custom">
          <input type="number" id="targetSize" value="20" min="1" max="2000" step="1" />
          <span>MB</span>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="resolution">解像度</label>
          <select id="resolution">
            <option value="auto">自動（元のまま）</option>
            <option value="1920">1080p（1920px）</option>
            <option value="1280">720p（1280px）</option>
            <option value="854">480p（854px）</option>
            <option value="640">360p（640px）</option>
          </select>
        </div>

        <div class="field">
          <label for="fps">フレームレート</label>
          <select id="fps">
            <option value="30">30 fps</option>
            <option value="24">24 fps</option>
            <option value="15">15 fps（より小さく）</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-primary" id="startBtn">圧縮を開始</button>
        <button type="button" class="btn btn-ghost" id="resetBtn">別の動画を選ぶ</button>
      </div>
    </section>

    <!-- 進捗 -->
    <section class="card" id="progressCard" hidden>
      <h1 class="card-title">圧縮中</h1>
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <p class="progress-text" id="progressText">準備中</p>
      <p class="progress-note" id="progressNote"></p>
    </section>

    <!-- 結果 -->
    <section class="card" id="resultCard" hidden>
      <h1 class="card-title">完了</h1>
      <div class="result-stats" id="resultStats"></div>
      <div class="result-video">
        <video id="resultVideo" controls playsinline></video>
      </div>
      <div class="actions">
        <a class="btn btn-primary" id="downloadBtn" download>ダウンロード</a>
        <button type="button" class="btn btn-ghost" id="againBtn">もう一度圧縮</button>
      </div>
    </section>

    <section class="note-card">
      <p class="note-title">プライバシーについて</p>
      <p>すべての処理はあなたのブラウザ内で行われます。動画がサーバーに送信されることはありません。</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Video Size Cutter</p>
    </div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
